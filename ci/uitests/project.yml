name: OnboardingDriver
options:
  bundleIdPrefix: local.autoci
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    COMPILER_INDEX_STORE_ENABLE: NO
targets:
  DriverHost:
    type: application
    platform: iOS
    sources: [DriverHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.autoci.driverhost
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  OnboardingDriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OnboardingDriverUITests]
    dependencies:
      - target: DriverHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.autoci.driverhost.uitests
        TEST_TARGET_NAME: DriverHost
schemes:
  OnboardingDriver:
    build:
      targets:
        DriverHost: all
        OnboardingDriverUITests: [test]
    test:
      config: Debug
      targets:
        - OnboardingDriverUITests
